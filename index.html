<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Na Régua">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Na Régua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna com barra de abas fixa embaixo; cronômetro de descanso flutua acima dela */
:root{
  --bg:#eef0ec; --surface:#fbfcf9; --line:#d5d9d1; --ink:#1d211c; --muted:#5f665c;
  --accent:#c98a0b; --accent-ink:#2e1f00; --accent-soft:#f6e7c4; --ok:#2f7a4c; --ok-soft:#dcefe2; --warn:#a05a00; --bar:#1d211c; --bar-ink:#eef0ec;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1d211d; --line:#30362f; --ink:#e7eae3; --muted:#9aa296;
  --accent:#e2a83a; --accent-ink:#1d1400; --accent-soft:#3a2f17; --ok:#6cc290; --ok-soft:#1f3a29; --warn:#e6a24d; --bar:#0d0f0d; --bar-ink:#e7eae3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1d211d; --line:#30362f; --ink:#e7eae3; --muted:#9aa296;
  --accent:#e2a83a; --accent-ink:#1d1400; --accent-soft:#3a2f17; --ok:#6cc290; --ok-soft:#1f3a29; --warn:#e6a24d; --bar:#0d0f0d; --bar-ink:#e7eae3; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.2rem;text-transform:uppercase}
h2{font-size:1.45rem;text-transform:uppercase}
h3{font-size:1.15rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);font-size:.85rem}
.mono{font-family:var(--mono)}
.head{display:flex;justify-content:space-between;align-items:start;gap:10px}
.sync{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-top:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card.hero{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.card.hero .sub{color:var(--bar-ink);opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:3rem;line-height:.9}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--bar-ink) 18%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 16px;border-radius:12px;text-align:center}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tag{font-family:var(--display);font-size:1.05rem;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 10px;border-radius:6px;letter-spacing:.04em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.strip{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:4px;align-items:stretch}
.strip .arr{border-radius:8px;color:var(--muted);font-size:1.1rem}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px 5px;display:grid;gap:1px;justify-items:center}
.day .dw{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--display);font-size:1.25rem;line-height:1}
.day .dt{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.day.today .dn{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dt{color:var(--bg);opacity:.75}
.dot{width:70%;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.dot i{display:block;height:100%;background:var(--ok)}
.ex{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:4px}
.ex .nm{font-weight:600;font-size:1rem}
.ex .nt{font-size:.82rem;color:var(--muted)}
.ex.done .nm{color:var(--ok)}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{min-width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:.85rem;display:grid;place-items:center}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.load{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.load input{width:76px;height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:16px}
.up{color:var(--ok);font-weight:600}
.note{font-size:.85rem;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.note.warn{border-color:var(--warn)}
.note.warn b{color:var(--warn)}
.meal{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.meal:first-child{border-top:0;padding-top:2px}
.tick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center}
.tick svg{width:20px;height:20px;stroke:currentColor;opacity:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick[aria-pressed="true"] svg{opacity:1}
.meal .tm{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.meal .mn{font-weight:600}
.meal ul{margin:4px 0 0;padding-left:18px;font-size:.88rem}
.meal.done .mi{opacity:.55}
.meal.next .mn::after{content:"próxima";margin-left:8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;background:var(--accent-soft);padding:2px 7px;border-radius:999px;vertical-align:2px}
.or{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.flag{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);font-weight:600;margin-left:6px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:4px 0}
details ul{font-size:.88rem;padding-left:18px;margin:6px 0}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:22px;height:30px;border:1.5px solid var(--line);border-radius:3px 3px 7px 7px;position:relative;overflow:hidden}
.cup.full{border-color:var(--accent)}
.cup.full::after{content:"";position:absolute;inset:30% 0 0;background:var(--accent);opacity:.75}
.stepper{display:flex;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:1.3rem}
.chk{display:flex;gap:12px;align-items:center;padding:4px 0}
.chk .tick{width:36px;height:36px}
.shop .it{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.shop .it .tick{width:34px;height:34px;flex:none}
.shop .it span:first-of-type{flex:1;min-width:0}
.shop .it.got span:first-of-type{text-decoration:line-through;color:var(--muted)}
.shop .q{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-align:right}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:90px}
.bars div{display:grid;gap:3px;align-items:end;height:100%}
.bars i{display:block;background:var(--ok);border-radius:3px 3px 0 0;min-height:2px}
.bars i.zero{background:var(--line)}
.bars span{font-family:var(--mono);font-size:.58rem;color:var(--muted);text-align:center}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.lift:first-child{border-top:0}
.lift svg{width:110px;height:30px;overflow:visible}
.lift .v{font-family:var(--mono);text-align:right}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field input{width:90px;height:40px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:16px}
ol.steps{margin:0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);color:var(--bar-ink);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.7rem;color:var(--bar-ink);opacity:.6;border-radius:10px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{opacity:1;color:var(--accent)}
.timer{position:fixed;z-index:11;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(var(--tabh) + 10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;
  background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:2rem;line-height:1;min-width:64px}
.timer .l{flex:1;font-size:.8rem;font-weight:600}
.timer button{background:rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-weight:600;font-size:.85rem}
.timer.end{background:var(--ok);color:var(--surface)}

.srows{display:grid;gap:6px}
.big-cta{font-size:1.05rem;padding:15px 18px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em}
.sess.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sess.live .meter{background:var(--line)}
.mono-big{font-family:var(--mono);font-size:2.4rem}
.sstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sstats div{display:grid}
.sstats .big{font-size:2rem}
[hidden]{display:none!important}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;max-width:360px}
.srow input{width:100%;height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:16px;text-align:center}
.srow input::placeholder{color:var(--muted);opacity:.7}
.srow .x{font-size:.75rem;color:var(--muted)}
.en{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono)}
.en[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.askf{display:flex;gap:8px}
.askf input{flex:1;min-width:0;height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px}
.askout{white-space:pre-wrap;font-size:.92rem;padding:12px;border-radius:12px;background:var(--accent-soft)}
.bodygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bstat{display:grid;gap:1px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.bodyform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:12px}
.bf{display:grid;gap:4px}
.bf input{height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:16px;width:100%}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.compare figure{margin:0;display:grid;gap:4px}
.compare img,.thumbs img{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.eyebrow{margin:0 0 2px;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;margin-top:6px}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--muted);font-size:.82rem;font-weight:600;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--warn)}
.link:disabled{opacity:.3}
.yt{color:var(--muted);font-size:.8rem;font-weight:600;text-decoration:none;margin-left:auto}
.note.ok{border-color:var(--ok)}
.note-card{border-color:var(--accent)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .nm{font-weight:600}
.prow.on .nm{color:var(--accent)}
.pacts{flex-basis:100%;display:flex;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:500;min-height:44px}
.chipb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pq{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.semana div{display:grid;justify-items:center;padding:6px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.semana .dw{font-size:.66rem;text-transform:uppercase;color:var(--muted)}
.semana .dn{font-family:var(--display);font-size:1.2rem}
.pv{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.pv ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem}
.pv li span:last-child{margin-left:8px}
.edias{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
select,.edt,.erow input,.bf input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;height:42px;padding:4px 8px;width:100%;min-width:0}
.edt{font-family:var(--display);font-weight:700;font-size:1.15rem;flex:1}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:6px;align-items:center;padding:6px 0}
.esr{font-family:var(--mono)!important;font-size:14px!important}
.emov{display:flex}
.emov .link{padding:6px 7px;text-decoration:none;font-size:1rem}
.eadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
@media (max-width:420px){.erow{grid-template-columns:minmax(0,1fr) 108px}.emov{grid-column:1/-1;justify-content:flex-end}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chipb.sm{padding:7px 11px;min-height:38px;font-size:.88rem}
.emov .link[data-swap]{font-size:.8rem;text-decoration:none;white-space:nowrap}
.gate{display:grid;gap:16px;padding-top:12px}
.brand{text-align:center}
.gate-h{text-align:center;font-size:2rem}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{display:grid;justify-items:center;gap:6px;padding:20px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:center}
.pcard .pname{font-weight:600;font-size:1.05rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.novo{border-style:dashed}
.pcard.novo .avatar{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1.3rem}
.pcard .avatar{width:64px;height:64px;font-size:1.9rem}
.big-av{width:76px;height:76px;font-size:2.2rem}
.av-btn{margin-top:6px}
.gate-card{display:grid;justify-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 16px}
.gate-card .gform{width:100%;max-width:280px}
.gform{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin-in{text-align:center;font-family:var(--mono)!important;font-size:1.6rem!important;letter-spacing:.6em;height:56px!important}
.msg{margin:0;color:var(--warn);font-weight:600;font-size:.9rem;text-align:center}
.gate-card .row{width:100%}
.exh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.thumb{position:relative;flex:none;width:112px;aspect-ratio:3/2;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:0;transition:width .2s}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.thumb img.b{animation:pose 2.4s ease-in-out infinite}
@keyframes pose{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.thumb.big{width:100%;flex-basis:100%;order:2}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.sets .set{min-width:52px;height:52px;font-size:1rem}
.fim{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;max-width:360px}
.frow input{width:100%;height:48px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:18px;text-align:center}
.frow input::placeholder{color:var(--muted);opacity:.7}
.frow .x{font-size:.8rem;color:var(--muted)}
.credito{font-size:.72rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.thumb img.b{animation:none;opacity:0}}
.extools{display:flex;flex-wrap:wrap;gap:6px}
.tool{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;padding:7px 11px;min-height:34px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.tool .ti{font-size:.95rem;line-height:1}
.tool.on{background:var(--accent-soft);border-color:var(--accent)}

const treinoAtivo=()=>{const P=plans();return P.treino.lista[P.treino.ativo]||null};
const dietaAtiva=()=>{const P=plans();return P.dieta.ativo?P.dieta.lista[P.dieta.ativo]||null:null};
/* treino do dia: {k, T, plan} ou null */
function treinoDia(d){const p=treinoAtivo();if(!p)return null;const k=(p.dias||{})[d.getDay()];return k&&p.treinos[k]?{k,T:p.treinos[k],plan:p}:null}
function faseDieta(d,p){p=p||dietaAtiva();if(!p)return null;const s=iso(d);return (p.agenda||[]).find(a=>!a.ate||s<=a.ate)||null}
/* cardápio do dia: {k, C, plan} ou null */
function cardapioDia(d){const p=dietaAtiva();if(!p)return null;if(p.inicio&&iso(d)<p.inicio)return null;const f=faseDieta(d,p);if(!f)return null;const k=f.dias[d.getDay()];return k&&p.cardapios[k]?{k,C:p.cardapios[k],plan:p}:null}
const meals=d=>{const c=cardapioDia(d);return c?c.C.ref:[]};
function phaseText(d){const p=dietaAtiva();if(!p)return '';const s=iso(d);if(p.inicio&&s<p.inicio)return 'Antes do início do plano';
  const f=faseDieta(d,p);if(!f)return '';const c=cardapioDia(d);
  if(f.ate&&p.inicio){const tot=Math.round((fromIso(f.ate)-fromIso(p.inicio))/864e5)+1;const n=Math.round((mid(d)-fromIso(p.inicio))/864e5)+1;return `${f.nome} · dia ${n} de ${tot}`}
  return `${f.nome}${c?' · '+c.C.nome.toLowerCase():''}`}
/* tempo do treino descontando as pausas (concluir e retomar) */
const durSess=s=>s&&s.start?Math.max(0,(s.end||Date.now())-s.start-(s.pausa||0)):0;
const restS=()=>{const p=treinoAtivo();return (p&&p.descanso&&p.descanso.s)||90};

function dayKeys(d){const td=treinoDia(d);const ks=[];
  if(td){exsDia(d,td).forEach(e=>{for(let s=0;s<nSets(e.sr);s++)ks.push('t-'+e.id+'-'+s)});if(td.T.cardio)ks.push('cardio')}
  meals(d).forEach(m=>ks.push('m-'+m[0]));return ks}
const prog=d=>{const k=dayKeys(d);return {done:k.filter(x=>on(d,x)).length,total:k.length}};
const pct=d=>{const p=prog(d);return p.total?p.done/p.total:0};
function streak(){let n=pct(TODAY)>=.8?1:0;let d=addD(TODAY,-1);for(let i=0;i<400;i++){if(prog(d).total&&pct(d)>=.8){n++;d=addD(d,-1)}else break}return n}

function prevSession(id,before){const L=lifts()[id]||{};const ds=Object.keys(L).filter(x=>x<before&&(L[x]||[]).some(hasW)).sort();
  if(ds.length)return {d:ds[ds.length-1],sets:L[ds[ds.length-1]]};const o=lastLoad(id,before);return o?{d:o.d,sets:[{w:o.v}]}:null}
function hitTop(sets,n,top){if(!top||!sets||!sets.length)return false;for(let s=0;s<n;s++){const x=sets[s]||sets[sets.length-1];if(!x||x.r==null||x.r===''||+x.r<top)return false}return true}
function seriesOf(id){const out={};const L=lifts()[id]||{};Object.keys(L).forEach(d=>{const ws=(L[d]||[]).filter(hasW).map(s=>+s.w);if(ws.length)out[d]=Math.max(...ws)});
  const o=loads()[id]||{};Object.keys(o).forEach(d=>{if(out[d]==null&&o[d]!=='')out[d]=+o[d]});return Object.keys(out).sort().map(d=>[d,out[d]])}
/* nome de um exercício pelo id, em qualquer plano salvo */
function exNome(id){const P=plans();for(const p of Object.values(P.treino.lista))for(const T of Object.values(p.treinos||{}))for(const e of T.ex)if(e.id===id)return e.nome;const mm=((docs.meus||{}).list||{})[id];return LIBM[id]?LIBM[id].nome:mm?mm.nome:id}

/* ================= gerador de treino ================= */
const SESSOES={
 FB:{nome:'Corpo inteiro',slots:['quad*','peito*','costas*','posterior*','ombro*','core','biceps','triceps','gluteo']},
 FB2:{nome:'Corpo inteiro',slots:['posterior*','costas*','peito*','quad*','ombro_lat','core','triceps','biceps','panturrilha']},
 PUSH:{nome:'Peito, ombros e tríceps',slots:['peito*','peito*','ombro*','ombro_lat','triceps','peito','triceps','core']},
 PULL:{nome:'Costas, ombro posterior e bíceps',slots:['costas*','costas*','ombro_post','costas','biceps','biceps','core','costas']},
 LEGS:{nome:'Pernas e core',slots:['quad*','posterior*','quad*','gluteo','posterior','panturrilha','core','quad']},
 UPPER:{nome:'Superiores',slots:['peito*','costas*','ombro*','costas*','peito','ombro_lat','biceps','triceps']},
 LOWER:{nome:'Inferiores e core',slots:['quad*','posterior*','gluteo','quad','posterior','panturrilha','core','gluteo']}};
const FOCO={nenhum:[],pernas:['gluteo','quad'],bracos:['biceps','triceps'],peito:['peito'],costas:['costas'],ombros:['ombro_lat'],abdomen:['core']};
const EQ_LOCAL={academia:['maq','cabo','barra','halter','corpo','elastico'],halteres:['halter','corpo'],casa:['corpo','elastico']};
const OBJ={
 hipertrofia:{nome:'Hipertrofia',rc:'8–10',ri:'10–12',desc:{s:90,txt:'60 a 90 s'}},
 forca:{nome:'Força',rc:'5–6',ri:'8–10',desc:{s:150,txt:'2 a 3 min'}},
 emagrecimento:{nome:'Emagrecimento',rc:'10–12',ri:'12–15',desc:{s:60,txt:'45 a 60 s'}},
 saude:{nome:'Saúde e condicionamento',rc:'10–12',ri:'12–15',desc:{s:60,txt:'45 a 60 s'}}};
const PREF={academia:['barra','halter','maq','cabo'],halteres:['halter'],casa:['elastico','corpo']};
const NIVEL={iniciante:1,intermediario:2,avancado:3};
const NEX={30:4,45:5,60:7,75:8};

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function splitFor(n,lv){
  if(n<=1)return ['FB'];if(n===2)return ['FB','FB2'];
  if(n===3)return lv===1?['FB','FB2','FB']:['PUSH','PULL','LEGS'];
  if(n===4)return ['UPPER','LOWER','UPPER','LOWER'];
  if(n===5)return ['PUSH','PULL','LEGS','UPPER','LOWER'];
  return ['PUSH','PULL','LEGS','PUSH','PULL','LEGS']}
function pickEx(g,needC,used,R,seed,across){
  const eq=EQ_LOCAL[R.local]||EQ_LOCAL.academia,L=NIVEL[R.nivel]||1,inj=R.lesoes||[];
  let c=LIB.filter(e=>e.g===g&&eq.includes(e.eq)&&!e.no.some(x=>inj.includes(x))&&!used.has(e.id));
  if(!c.length)return null;
  const byLv=c.filter(e=>e.lv<=L);if(byLv.length)c=byLv;
  if(g!=='core'){const pf=c.filter(e=>(PREF[R.local]||PREF.academia).includes(e.eq));if(pf.length)c=pf}
  if(needC){const cc=c.filter(e=>e.c);if(cc.length)c=cc}
  if(L===1){const easy=c.filter(e=>e.lv===1);if(easy.length)c=easy}
  if(across){const fresh=c.filter(e=>!across.has(e.id));if(fresh.length)c=fresh}
  c.sort((a,b)=>hash(a.id+seed)-hash(b.id+seed));return c[0]}
function seriesFor(e,R){const o=OBJ[R.objetivo]||OBJ.hipertrofia,L=NIVEL[R.nivel]||1;
  let n=L===3?(e.c?4:3):(L===1&&!e.c?2:3);
  if(e.t)return `${L===1?2:3} × ${L===1?'20–30':'30–45'} s`;
  const reps=e.g==='panturrilha'||e.g==='core'?'15–20':e.c?o.rc:o.ri;
  return `${n} × ${reps}`}
function gerarTreino(R,variacao){
  const days=(R.dias||[]).map(Number).sort((a,b)=>((a+6)%7)-((b+6)%7));const L=NIVEL[R.nivel]||1;
  const split=splitFor(days.length,L);const nEx=NEX[R.tempo]||7;const o=OBJ[R.objetivo]||OBJ.hipertrofia;const foco=FOCO[R.foco]||[];
  const letras='ABCDEF';const across=new Set();const treinos={};const mapa={0:null,1:null,2:null,3:null,4:null,5:null,6:null};
  const repeat=days.length===6; /* 6 dias: A B C repetidos, como o ABC 2x */
  split.forEach((tpl,i)=>{
    const letra=repeat?letras[i%3]:letras[i];mapa[days[i]]=letra;if(treinos[letra])return;
    let slots=SESSOES[tpl].slots.slice(0,nEx);
    const fg=foco.filter(g=>tpl.startsWith('FB')||SESSOES[tpl].slots.some(s=>s.replace('*','')===g));
    if(fg.length){const at=Math.min(3,slots.length);slots=[...slots.slice(0,at),fg[0],...slots.slice(at)]}
    const used=new Set();const ex=[];const seed=(variacao||0)+':'+i+':'+(R.seed||0);
    slots.forEach((s,j)=>{const g=s.replace('*','');const e=pickEx(g,s.endsWith('*'),used,R,seed+':'+j,across);if(!e)return;used.add(e.id);across.add(e.id);
      ex.push({id:e.id,nome:e.nome,sr:seriesFor(e,R),nota:e.c?'Multiarticular: comece por ele com a técnica bem feita':''})});
    const cardio=R.cardio==='apos'?(R.objetivo==='emagrecimento'?'20–30 min de esteira, bike ou elíptico, ritmo moderado.':'10–20 min de esteira, bike ou elíptico, ritmo moderado.'):null;
    treinos[letra]={nome:SESSOES[tpl].nome,cardio,ex}});
  const notas=[];
  if((R.lesoes||[]).length)notas.push('Evitei exercícios que costumam forçar: '+R.lesoes.join(', ')+'. Se algum movimento doer, pare e procure um profissional.');
  if(R.local==='casa')notas.push('Treino pensado para casa, com peso corporal e elástico. Um elástico de resistência média ajuda bastante.');
  if(L===1)notas.push('Nas primeiras 2 semanas, use cargas leves para aprender os movimentos. Depois vá subindo aos poucos.');
  return {id:'t-'+Date.now().toString(36),tipo:'treino',nome:'Treino '+o.nome.toLowerCase()+' · '+ddmm(TODAY),criado:iso(TODAY),origem:'gerado',
    respostas:R,variacao:variacao||0,descanso:o.desc,limite:R.tempo||60,dias:mapa,treinos,notas,
    cardioLivre:R.cardio==='separado'?'Dia de cardio: 30–40 min de caminhada rápida, bike ou natação, ritmo leve a moderado.':null}}

/* ---------- sessão de treino ---------- */
const mmss=ms=>{const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
function sessStats(d,td){const D=iso(d);let sets=0,vol=0,total=0;exsDia(d,td).forEach(e=>{const n=nSets(e.sr);total+=n;const cur=(lifts()[e.id]||{})[D]||[];
  for(let s=0;s<n;s++){if(on(d,'t-'+e.id+'-'+s)){sets++;const c=cur[s]||cur[cur.length-1];if(hasW(c)&&c.r)vol+=(+c.w)*(+c.r)}}});return {sets,total,vol:Math.round(vol)}}
function sessCard(d,td){const ss=dayDoc(d).sess;const st=sessStats(d,td);const lim=td.plan.limite||60;
  if((!ss||(!ss.start&&!ss.end))&&ciOpen&&+mid(d)===+TODAY)return ciCard(td);
  if(!ss||(!ss.start&&!ss.end)){return +mid(d)===+TODAY?`<section class="card sess"><div><span class="label">Treino ${td.k} de hoje</span><h3>Pronto para começar?</h3><p class="sub" style="margin:0">O cronômetro do treino começa, a tela fica acesa e o app leva você ao primeiro exercício.</p></div><button class="btn big-cta" data-sess="start">Iniciar treino</button></section>`:''}
  if(!ss.end)return `<section class="card sess live"><div class="row"><span class="label">Treino em andamento</span><span class="sub mono">${st.sets}/${st.total} séries</span></div>
    <div class="row" style="align-items:end"><span class="big mono-big" id="sessT">${mmss(durSess(ss))}</span><button class="btn ghost" data-sess="end">Concluir</button></div>
    <div class="meter"><i style="width:${st.total?st.sets/st.total*100:0}%"></i></div><p class="sub" id="sessW" data-lim="${lim}" style="margin:0">${durSess(ss)>lim*60000?`Passou de ${lim} min: hora de fechar.`:`Meta: até ${lim} min de treino.`}</p>${resetBtn()}</section>`;
  return `<section class="card sess done"><div class="row"><span class="label">Treino concluído</span><button class="btn ghost" data-sess="resume" style="padding:6px 12px">Retomar</button></div>
    <div class="sstats"><div><span class="big mono-sm">${ss.start?mmss(durSess(ss)):'–'}</span><span class="sub">tempo total</span></div><div><span class="big">${st.sets}/${st.total}</span><span class="sub">séries</span></div><div><span class="big">${st.vol.toLocaleString('pt-BR')}</span><span class="sub">kg de volume</span></div></div>${prsDoDia(iso(d)).length?`<div class="prs">${prsDoDia(iso(d)).map(id=>`<span class="pr">★ ${esc(exNome(id))}</span>`).join('')}</div>`:''}<button class="btn ghost" data-sub="historico">Ver histórico</button>${resetBtn()}</section>`}

function lineChart(pts){

  const t0=fromIso(pts[0][0])/864e5,t1=fromIso(pts[pts.length-1][0])/864e5;
  const X=d=>pl+((fromIso(d)/864e5-t0)/((t1-t0)||1))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');const last=pts[pts.length-1];
  const T=(x,y,t,a)=>`<text x="${x}" y="${y}" ${a?`text-anchor="${a}"`:''} font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto;display:block" role="img" aria-label="Evolução do peso">
  <line x1="${pl}" x2="${W-pr}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="${pl}" x2="${W-pr}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)" stroke-dasharray="3 3"/>
  ${T(pl-6,Y(mx)+4,fmtKg(+mx.toFixed(1)),'end')}${T(pl-6,Y(mn)+4,fmtKg(+mn.toFixed(1)),'end')}
  <polygon points="${pl},${H-pb} ${line} ${X(last[0]).toFixed(1)},${H-pb}" fill="var(--accent)" opacity=".14"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="var(--accent)"/>${T(pl,H-6,isoDdmm(pts[0][0]))}${T(W-pr,H-6,isoDdmm(last[0]),'end')}</svg></div>`}
const spark=v=>{if(v.length<2)return '<svg viewBox="0 0 110 30"></svg>';const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>[i/(v.length-1)*106+2,26-(y-mn)/r*22]);
  return `<svg viewBox="0 0 110 30"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--accent)"/></svg>`};

function shrink(file){return new Promise((res,rej)=>{const im=new Image();const u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};im.onerror=()=>rej(new Error('img'));im.src=u})}
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('meu-treino',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}};
const photoURL={};
async function loadPhotos(){for(const p of ((docs.photos||{}).items||[])){if(photoURL[p.id])continue;try{const b=await IDB.get(p.id);if(b)photoURL[p.id]=URL.createObjectURL(b)}catch(e){}}render()}
async function addPhoto(file){photoMsg='Salvando foto...';render();
  try{const blob=await shrink(file);const id='p'+Date.now();await IDB.put(id,blob);photoURL[id]=URL.createObjectURL(blob);
    const P=clone(docs.photos);P.items=(P.items||[]).concat({id,d:iso(TODAY)});photoMsg='Foto salva neste celular.';save('photos',P)}
  catch(e){photoMsg='Não consegui salvar a foto. Tente de novo.';render()}}
function baixar(nome,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();a.remove()}

function weekSum(w){const out={plan:0,feitos:0,series:0,vol:0,ref:0,refTot:0,agua:[],prs:0,evo:null,tempo:0,dias:[]};const fim=addD(w,6);
  for(let i=0;i<7;i++){const t=tempoDia(iso(addD(w,i)));out.dias.push(t);out.tempo+=t}
  for(let i=0;i<7;i++){const d=addD(w,i);if(d>TODAY)break;const D=iso(d);const x=dayDoc(d);const td=treinoDia(d);
    if(td)out.plan++;const ch=Object.keys(x.chk||{}).filter(k=>k.startsWith('t-'));if(ch.length||(x.sess&&x.sess.end))out.feitos++;out.series+=ch.length;

  const ss=sessoes().filter(s=>s.D>=iso(w)&&s.D<=iso(fim));out.vol=ss.reduce((a,s)=>a+s.vol,0);
  const E=bodyE();const pd=Object.keys(E).filter(d=>E[d].peso!=null&&E[d].peso!==''&&d<=iso(fim)).sort();const inW=pd.filter(d=>d>=iso(w));
  if(inW.length){const before=pd.filter(d=>d<iso(w));const a=before.length?+E[before[before.length-1]].peso:+E[inW[0]].peso;const b=+E[inW[inW.length-1]].peso;out.peso={b,dl:+(b-a).toFixed(1),base:before.length||inW.length>1}}
  Object.keys(lifts()).forEach(id=>{const a=bestOf(id,d=>d<iso(w));const b=bestOf(id,d=>d>=iso(w)&&d<=iso(fim));if(a&&b&&b.w>a.w){const dl=+(b.w-a.w).toFixed(1);if(!out.evo||dl>out.evo.dl)out.evo={nome:exNome(id),dl}}});
  return out}

let msOff=0;
function monthSum(y,m){const ini=new Date(y,m,1),fim=new Date(y,m+1,0);const out={tempo:0,feitos:0,series:0,vol:0,prs:0,ref:0,refTot:0,dias:{},plan:0};
  for(let d=new Date(ini);d<=fim&&d<=TODAY;d=addD(d,1)){const D=iso(d);const x=dayDoc(d);const ch=Object.keys(x.chk||{}).filter(k=>k.startsWith('t-'));const t=tempoDia(D);
    if(treinoDia(d))out.plan++;if(ch.length||(x.sess&&x.sess.end)){out.feitos++;out.dias[d.getDate()]=t||1}out.tempo+=t;out.series+=ch.length;out.prs+=prsDoDia(D).length;
    const ms=meals(d);out.refTot+=ms.length;out.ref+=ms.filter(mm=>on(d,'m-'+mm[0])).length}
  out.vol=sessoes().filter(s=>s.D>=iso(ini)&&s.D<=iso(fim)).reduce((a,s)=>a+s.vol,0);
  const E=bodyE();const pd=Object.keys(E).filter(d=>E[d].peso!=null&&E[d].peso!==''&&d<=iso(fim)).sort();const inM=pd.filter(d=>d>=iso(ini));
  if(inM.length){const bef=pd.filter(d=>d<iso(ini));const a=bef.length?+E[bef[bef.length-1]].peso:+E[inM[0]].peso;const b=+E[inM[inM.length-1]].peso;if(bef.length||inM.length>1)out.peso=+(b-a).toFixed(1)}
  /* maior sequência de dias com treino feito */
  let seq=0,best=0;for(let i=1;i<=fim.getDate();i++){const d=new Date(y,m,i);if(d>TODAY)break;if(out.dias[i])best=Math.max(best,++seq);else if(treinoDia(d))seq=0}out.seq=best;
  return out}

const repRange=sr=>{if(/s\s*$/.test(sr.trim())||/falha/i.test(sr))return null;const m=sr.match(/×\s*(\d+)(?:\s*[–-]\s*(\d+))?/);return m?{lo:+m[1],hi:+(m[2]||m[1])}:null};

/* sessões anteriores com carga anotada, da mais recente para a mais antiga */
function histEx(id,before){const L=lifts()[id]||{};return Object.keys(L).filter(d=>d<before).sort().reverse().map(d=>{const c=(L[d]||[]).filter(hasW).pop();return c?{d,w:+c.w,r:+c.r||0}:null}).filter(Boolean)}
function estagnado(id,before){const h=histEx(id,before).slice(0,4);if(h.length<4)return false;
  const sc=x=>x.w*(1+x.r/30);const base=sc(h[3]);return h.slice(0,3).every(x=>sc(x)<=base+0.01)}
function prontidao(d){return dayDoc(d).pront||null}
/* meta de hoje: progressão dupla (subir reps até o topo da faixa, depois subir carga) */
function metaDia(id,sr,d){const rr=repRange(sr);const h=histEx(id,iso(d));const p=prontidao(d);const leve=p&&p.score<=2;
  if(!rr)return null;if(!h.length)return {w:null,txt:`escolha uma carga para ${rr.lo===rr.hi?rr.lo:rr.lo+' a '+rr.hi} reps com boa técnica`,tipo:'novo'};
  const u=h[0];
  if(leve)return {w:u.w,r:Math.max(rr.lo,Math.min(u.r,rr.hi)),txt:`${fmtKg(u.w)} kg × ${rr.lo}–${rr.hi}`,tipo:'leve',why:'dia leve: mantenha a carga'};
  if(u.r>=rr.hi){const nw=+(u.w+passo(u.w)).toFixed(1);return {w:nw,r:rr.lo,txt:`${fmtKg(nw)} kg × ${rr.lo}–${rr.hi}`,tipo:'sobe',why:`subir a carga: da última vez foram ${u.r} reps`}}
  if(u.r<rr.lo)return {w:u.w,r:rr.lo,txt:`${fmtKg(u.w)} kg × ${rr.lo}`,tipo:'firma',why:`chegar a ${rr.lo} reps antes de subir`};
  const r=Math.min(u.r+1,rr.hi);return {w:u.w,r,txt:`${fmtKg(u.w)} kg × ${r}`,tipo:'reps',why:'mais uma repetição que da última vez'}}

const thumbHtml=(id,nome,cls)=>{const im=exImg(id);return im?`<span class="pthumb ${cls||''}"><img src="${im[0]}" alt="" loading="lazy"><img class="b" src="${im[1]}" alt="" loading="lazy"></span>`:`<span class="pthumb letra ${cls||''}">${esc(inicial(nome))}</span>`};
let pk=null;
/* mode: add (editor) · rep (editor, trocar um) · hoje (só no dia, na tela de treino) */
function pkOpen(spec){const [mode,a,b]=spec.split(':');pk={mode,tab:'sel',q:'',eq:'todos',g:'todos'};
  if(mode==='add'){pk.l=a;const p=plans().treino.lista[editId];const gs=(p.treinos[a].grupos||[]);const g0=gs.length&&CHIPM[gs[0]]?CHIPM[gs[0]][2][0][0]:'todos';pk.g=g0}
  if(mode==='rep'){pk.l=a;pk.i=+b;const p=plans().treino.lista[editId];const e=p.treinos[a].ex[+b];pk.g=grpBase(e)||'todos';pk.atual=e}
  if(mode==='hoje'){pk.orig=a;const td=treinoDia(sel);const e=td&&td.T.ex.find(x=>x.id===a);pk.g=(e&&grpBase(e))||'todos';pk.atual=e}
  pk.wg=pk.g;render();setTimeout(()=>{const s=document.querySelector('.sheet');s&&s.focus()},30)}
function pkClose(){pk=null;render()}
function pkUsados(){if(pk.mode==='hoje'){const td=treinoDia(sel);return new Set(td?exsDia(sel,td).map(x=>x.id):[])}
  const p=plans().treino.lista[editId];return new Set((p&&p.treinos[pk.l]?p.treinos[pk.l].ex:[]).map(x=>x.id.replace(/-[a-z0-9]{2,4}$/,'')))}
function pkCfg(){if(pk.mode==='hoje'){const td=treinoDia(sel);return td?cfgOf(td.plan):CFG0()}return cfgOf(plans().treino.lista[editId])}
function pkItens(){const q=normTxt(pk.q);const cfg=pkCfg();const pf=PREF[cfg.local]||PREF.academia;
  const todos=[...Object.entries(meus()).map(([id,m])=>Object.assign({id,eq:'',lv:1,no:[],meu:true},m)),...LIB];
  return todos.filter(e=>(pk.g==='todos'||e.g===pk.g)&&(pk.eq==='todos'||e.eq===pk.eq)&&(!q||normTxt(e.nome).includes(q)||normTxt(GRUPOS[e.g]).includes(q)))
    .sort((a,b)=>(b.meu?1:0)-(a.meu?1:0)||(pf.includes(b.eq)-pf.includes(a.eq))||(b.c-a.c)||a.nome.localeCompare(b.nome))}
function pkList(){const it=pkItens();const usados=pkUsados();const inj=pkCfg().lesoes||[];
  if(!it.length)return `<div class="pk-vazio"><p style="margin:0">Nenhum exercício encontrado.</p><button class="btn ghost" data-pktab="esc">Escrever "${esc(pk.q||'meu exercício')}"</button></div>`;
  return `<p class="sub pk-count">${it.length} exercício${it.length>1?'s':''}</p>`+it.map(e=>{const u=usados.has(e.id);const cuid=e.no&&e.no.some(x=>inj.includes(x));
    return `<button class="pk-item${u?' usado':''}" data-pkpick="${e.id}" ${u?'disabled':''}>${thumbHtml(e.id,e.nome)}
     <span class="pk-txt"><b>${esc(e.nome)}</b><span class="sub">${esc(GRUPOS[e.g]||'')}${e.eq?' · '+EQN[e.eq]:''}${e.meu?' · seu':' · '+LVN[e.lv]}</span>${cuid?'<span class="pk-cuid">cuidado com a sua lesão</span>':''}</span>
     <span class="pk-add">${u?'no treino':pk.mode==='add'?'+':'⇄'}</span></button>`}).join('')}
function pkSheet(){if(!pk)return '';const tit=pk.mode==='add'?'Adicionar exercício':pk.mode==='rep'?'Trocar exercício':'Trocar só hoje';
  const gsel=[['todos','Todos'],...Object.entries(GRUPOS)];const eqs=[['todos','Tudo'],...Object.entries(EQN)];
  const at=pk.atual;
  return `<div class="sheet-bg" data-pkclose="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${tit}" tabindex="-1">
   <div class="sheet-h"><span class="grab"></span><div class="row"><h2>${tit}</h2><button class="pill" data-pkclose="1" style="margin:0">Fechar</button></div>
    ${at?`<p class="sub" style="margin:0">Atual: <b>${esc(at.nome)}</b></p>`:''}
    <div class="seg" role="tablist"><button role="tab" aria-selected="${pk.tab==='sel'}" data-pktab="sel">Selecionar</button><button role="tab" aria-selected="${pk.tab==='esc'}" data-pktab="esc">Escrever</button></div></div>
   ${pk.tab==='sel'?`<div class="sheet-f">
     <input id="pk-q" class="pk-q" type="search" placeholder="Buscar exercício (ex.: supino, rosca)" value="${esc(pk.q)}" autocomplete="off" aria-label="Buscar exercício">
     <div class="hscroll">${gsel.map(([k,n])=>`<button class="chipb sm" aria-pressed="${pk.g===k}" data-pkg="${k}">${n}</button>`).join('')}</div>
     <div class="hscroll">${eqs.map(([k,n])=>`<button class="chipb sm alt" aria-pressed="${pk.eq===k}" data-pkeq="${k}">${n}</button>`).join('')}</div></div>
    <div class="sheet-b" id="pk-list">${pkList()}</div>`
   :`<form id="pkF" class="sheet-b gform">
     <label class="bf"><span class="sub">Nome do exercício *</span><input id="pk-nome" value="${esc(pk.q||(pk.mode!=='add'&&at&&!LIBM[at.id]?at.nome:''))}" placeholder="Ex.: Remada no aparelho da academia" required></label>
     <label class="bf"><span class="sub">Grupo muscular</span><select id="pk-g">${Object.entries(GRUPOS).map(([k,n])=>`<option value="${k}" ${pk.wg===k?'selected':''}>${n}</option>`).join('')}</select></label>
     ${pk.mode!=='hoje'?`<label class="bf"><span class="sub">Séries × repetições</span><input id="pk-sr" value="${esc(pk.mode==='rep'&&at?at.sr:'3 × 10–12')}" placeholder="3 × 10–12"></label>`:''}
     <label class="bf"><span class="sub">Observação (opcional)</span><input id="pk-nota" placeholder="Ex.: banco a 30°, pegada aberta"></label>
     <p class="sub" style="margin:0">O exercício fica salvo em "seus exercícios" e aparece no topo da aba Selecionar.</p>
     <button class="btn big-cta" type="submit">${pk.mode==='add'?'Adicionar ao treino':pk.mode==='rep'?'Trocar pelo meu':'Usar hoje'}</button></form>`}
   </div>`}
function pkAplicar(id,extra){const info=exInfo(id);if(!info)return;
  if(pk.mode==='hoje'){const x=clone(dayDoc(sel));x.swaps=x.swaps||{};if(id===pk.orig)delete x.swaps[pk.orig];else x.swaps[pk.orig]=id;const n=info.nome;pk=null;save('day-'+iso(sel),x);toast('Trocado só hoje',n);return}
  const l=pk.l,i=pk.i,mode=pk.mode;
  editPlan(p=>{const T=p.treinos[l];const ids=new Set(T.ex.map(x=>x.id));const nid=ids.has(id)?id+'-'+Date.now().toString(36).slice(-3):id;const cfg=cfgOf(p);
    const sr=(extra&&extra.sr)||(mode==='rep'&&T.ex[i]&&!info.t&&!/s\s*$/.test(T.ex[i].sr)?T.ex[i].sr:seriesFor(info,cfg));
    const novo={id:nid,nome:info.nome,sr,nota:(extra&&extra.nota)||'',g:info.g};
    if(mode==='add')T.ex.push(novo);else{novo.rest=T.ex[i]&&T.ex[i].rest;T.ex[i]=novo}});
  const n=info.nome;pk=null;render();toast(mode==='add'?'Adicionado':'Trocado',n)}
function pkEscrever(){const nome=document.getElementById('pk-nome').value.trim();if(!nome){document.getElementById('pk-nome').focus();return}
  const g=document.getElementById('pk-g').value;const srEl=document.getElementById('pk-sr');const nota=document.getElementById('pk-nota').value.trim();
  /* reaproveita um exercício seu com o mesmo nome */
  let id=Object.entries(meus()).find(([,m])=>normTxt(m.nome)===normTxt(nome))?.[0];
  if(!id){id='m'+Date.now().toString(36);const M=clone(docs.meus);M.list=M.list||{};M.list[id]={nome,g,criado:iso(TODAY)};save('meus',M,true)}
  pkAplicar(id,{sr:srEl&&srEl.value.trim()?srEl.value.trim():null,nota})}
document.addEventListener('input',e=>{if(e.target.id==='pk-q'&&pk){pk.q=e.target.value;const L=document.getElementById('pk-list');if(L)L.innerHTML=pkList()}});

function avAbrir(){avEd=Object.assign(avOf(prof()),{zoom:1,orig:null,msg:''});avEd.aba=avEd.tipo;render()}

/* recorte quadrado central com zoom, 240 px */
function avRecortar(){const im=avEd.orig;if(!im)return;const S=240,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const lado=Math.min(im.width,im.height)/avEd.zoom;x.drawImage(im,(im.width-lado)/2,(im.height-lado)/2,lado,lado,0,0,S,S);avEd.foto=c.toDataURL('image/jpeg',.82)}
function avCarregar(file){const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{avEd.orig=im;avEd.zoom=1;avRecortar();avEd.msg='';render()};im.onerror=()=>{avEd.msg='Não consegui abrir essa imagem.';render()};im.src=u}

/* ================= render e eventos ================= */
const VIEWS={hoje:vHoje,treino:vTreino,dieta:vDieta,compras:vCompras,progresso:vProgresso};
const SUBS={planos:vPlanos,quiz:vQuiz,editor:vEditor,historico:vHistorico};
const app=document.getElementById('app');
function render(){
  const act=document.activeElement;if(act&&/INPUT|TEXTAREA|SELECT/.test(act.tagName)&&app.contains(act))return;
  const nav=document.querySelector('.tabs');nav.hidden=!!gate;if(gate){app.innerHTML=`<div class="gate">${GATES[gate]()}</div>`;return}
  app.innerHTML=(sub?SUBS[sub]():VIEWS[tab]())+(pk?pkSheet():'')+(avEd?avSheet():'');document.body.classList.toggle('lock',!!(pk||avEd));
  document.querySelectorAll('.tabs button').forEach(b=>{if(!sub&&b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
function goSub(s){sub=s;window.scrollTo(0,0);render()}
function setTab(t){tab=t;sub=null;planMsg='';pendDel=null;try{localStorage.setItem('ui:tab',t)}catch(e){}window.scrollTo(0,0);render();wake()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

app.addEventListener('click',e=>{
  {const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&app.contains(ae)&&!e.target.closest('input,textarea,select,label'))ae.blur()}

  if(ds.pkclose){pkClose();return}
  if(ds.pktab){const q=document.getElementById('pk-q');if(q)pk.q=q.value;pk.tab=ds.pktab;document.activeElement&&document.activeElement.blur();render();return}
  if(ds.pkg){pk.g=ds.pkg;if(ds.pkg!=='todos')pk.wg=ds.pkg;document.activeElement&&document.activeElement.blur();render();const L=document.getElementById('pk-list');if(L)L.scrollTop=0;return}
  if(ds.pkeq){pk.eq=ds.pkeq;document.activeElement&&document.activeElement.blur();render();return}
  if(ds.pkpick){pkAplicar(ds.pkpick);return}
  /* perfis */
  if(ds.pick){const p=profs().list[ds.pick];if(p&&p.pin){pinFor=ds.pick;pinMsg='';pinReset=false;gate='pin';render();setTimeout(()=>{const i=document.getElementById('pin-in');i&&i.focus()},60)}else enterProfile(ds.pick);return}
  if(ds.pnew){pfEdit=null;pfMsg='';gate='form';window.scrollTo(0,0);render();return}
  if(ds.gate){if(ds.gate==='back'){pfEdit=null;pfDel=false;gate=null;render();return}if(ds.gate==='picker'){sessSet(null);ciOpen=false}gate=ds.gate;pfDel=false;pinMsg='';window.scrollTo(0,0);render();return}
  if(ds.pinreset){pinReset=true;pinMsg='';render();return}

  if(ds.pdel){if(!pfDel){pfDel=true;render();return}deleteProfile(pfEdit);pfDel=false;pfEdit=null;PID=null;loadDocs();startGate();if(!gate)enterProfile(PID);else render();return}
  /* navegação */

  if(ds.back){if(sub==='editor'){const P=plans();const ep=P.treino.lista[editId];if(ep){if(ep.origem==='montado'&&!Object.values(ep.treinos).some(T=>T.ex.length)&&P.treino.ativo!==ep.id){delete P.treino.lista[editId];planMsg='Treino vazio descartado.'}else ep.salvo=true}savePlans(P,true);pendSug=null;pendRmT=null;goSub('planos');return}sub=null;gerado=null;planMsg='';pendDel=null;window.scrollTo(0,0);render();return}

  if(ds.cfg){editPlan(p=>{p.cfg=Object.assign(cfgOf(p),{[ds.cfg]:ds.v});if(ds.cfg==='objetivo')p.descanso=OBJ[ds.v].desc});return}
  if(ds.grp){const [l,k]=ds.grp.split(':');editPlan(p=>{const T=p.treinos[l];const g=T.grupos||[];const i=g.indexOf(k);if(i>=0)g.splice(i,1);else g.push(k);
    T.grupos=CHIPS.map(c=>c[0]).filter(c=>g.includes(c));if(T.auto||!T.nome){T.nome=nomeGrupos(T.grupos);T.auto=true}});pendSug=null;return}
  if(ds.sug){const l=ds.sug;const p0=plans().treino.lista[editId];if(p0.treinos[l].ex.length&&pendSug!==l){pendSug=l;render();return}
    pendSug=null;editPlan(p=>sugerir(p,l));return}
  if(ds.swap){const [l,i]=ds.swap.split(':');editPlan(p=>{trocar(p,l,+i)});return}
  if(ds.addt){editPlan(p=>{const l='ABCDEF'.split('').find(x=>!p.treinos[x]);if(l)p.treinos[l]={nome:'',grupos:[],ex:[],auto:true}});return}
  if(ds.rmt){const l=ds.rmt;if(pendRmT!==l){pendRmT=l;render();return}pendRmT=null;
    editPlan(p=>{delete p.treinos[l];for(const k of Object.keys(p.dias))if(p.dias[k]===l)p.dias[k]=null});return}
  if(ds.semdieta){const P=plans();P.dieta.ativo=null;planMsg='Usando orientações gerais de alimentação.';savePlans(P);return}
  if(ds.edit){editId=ds.edit;goSub('editor');return}
  if(ds.exp){const [t,id]=ds.exp.split(':');const p=plans()[t].lista[id];baixar('na-regua-'+slug(p.nome)+'.json',{app:'na-regua',v:1,plano:p});return}
  if(ds.del){const [t,id]=ds.del.split(':');if(pendDel!==id){pendDel=id;render();return}
    const P=plans();const nome=P[t].lista[id].nome;delete P[t].lista[id];if(P[t].ativo===id){const r=Object.keys(P[t].lista);P[t].ativo=t==='treino'&&r.length?r[0]:null}
    pendDel=null;planMsg=`"${nome}" excluído.`;savePlans(P);return}
  /* questionário */
  if(ds.q){const v=isNaN(+ds.v)?ds.v:+ds.v;
    if(ds.multi){const a=(qz[ds.q]||[]).slice();const i=a.indexOf(v);if(i>=0)a.splice(i,1);else{if(ds.q==='dias'&&a.length>=6)return;a.push(v)}qz[ds.q]=a}else qz[ds.q]=v;render();return}
  if(ds.pq){qz.parq[+ds.pq]=+ds.v;if(!qz.parq.includes(1))qz.ok=false;render();return}
  if(ds.qok){qz.ok=!qz.ok;render();return}
  if(ds.gerar){gerado=gerarTreino(qz,0);window.scrollTo(0,0);render();return}
  if(ds.var){gerado=gerarTreino(gerado.respostas,(gerado.variacao||0)+1);render();return}
  if(ds.ajustar){gerado=null;render();return}
  if(ds.usargerado){const P=plans();P.treino.lista[gerado.id]=gerado;P.treino.ativo=gerado.id;gerado=null;qz=null;sub=null;tab='treino';sel=new Date(TODAY);
    try{localStorage.setItem('ui:tab','treino')}catch(e){}window.scrollTo(0,0);savePlans(P);return}
  if(ds.regen){const p=plans().treino.lista[ds.regen];qz=Object.assign(QZ0(),clone(p.respostas));gerado=gerarTreino(qz,(p.variacao||0)+1);goSub('quiz');return}
  /* editor */
  if(ds.mv){const [l,i,dir]=ds.mv.split(':');editPlan(p=>{const a=p.treinos[l].ex;const j=+i+ +dir;if(j<0||j>=a.length)return;[a[+i],a[j]]=[a[j],a[+i]]});return}
  if(ds.rm){const [l,i]=ds.rm.split(':');editPlan(p=>{p.treinos[l].ex.splice(+i,1)});return}
  if(ds.add){const l=ds.add;const v=document.getElementById('ed-add-'+l).value;
    editPlan(p=>{if(v==='_custom')p.treinos[l].ex.push({id:'x'+Date.now().toString(36),nome:'Novo exercício',sr:'3 × 10–12',nota:''});
      else{const e=LIBM[v];const ids=new Set(p.treinos[l].ex.map(x=>x.id));p.treinos[l].ex.push({id:ids.has(e.id)?e.id+'-'+Date.now().toString(36).slice(-3):e.id,nome:e.nome,sr:seriesFor(e,cfgOf(p)),nota:'',g:e.g})}});return}
  /* dia a dia */
  if(ds.backup){exportBackup();return}
  if(ds.sess==='start'){ciOpen=true;ci={sono:null,en:null,dor:null};sel=new Date(TODAY);sub=null;if(tab!=='treino'){tab='treino';try{localStorage.setItem('ui:tab','treino')}catch(e){}}window.scrollTo(0,0);render();return}
  if(ds.ci){const [k,v]=ds.ci.split(':');ci[k]=+v;if(CI.every(([q])=>ci[q]!==null)&&ci.leve===undefined)ci.leve=ciScore()<=2;render();return}
  if(ds.cileve){ci.leve=!ci.leve;render();return}
  if(ds.share){compartilharSemana(fromIso(ds.share));return}
  if(ds.sess){const go=ds.sess==='go'||ds.sess==='skip';const D=go?TODAY:sel;const x=clone(dayDoc(D));
    if(go){const tdS=treinoDia(TODAY);if(ds.sess==='go'){const sc=ciScore();x.pront={sono:ci.sono,en:ci.en,dor:ci.dor,score:sc};x.leve=!!(ci.leve&&sc<=2)}ciOpen=false;x.sess={start:Date.now(),end:null,k:tdS&&tdS.k,nome:tdS&&tdS.T.nome};sel=new Date(TODAY);sub=null;if(tab!=='treino'){tab='treino';try{localStorage.setItem('ui:tab','treino')}catch(e){}}save('day-'+iso(D),x);wake();setTimeout(scrollNext,50)}
    else if(ds.sess==='end'){const tdE=treinoDia(D);x.sess={k:tdE&&tdE.k,nome:tdE&&tdE.T.nome,...(x.sess||{}),end:Date.now()};pararTudo();save('day-'+iso(D),x);celebrar(iso(D))}
    else{/* retomar: continua do tempo em que parou (o intervalo parado vira pausa) */
      const s0=x.sess||{};const agora=Date.now();
      x.sess=s0.start?{...s0,pausa:(s0.pausa||0)+(s0.end?agora-s0.end:0),end:null,last:agora}:{...s0,start:agora,pausa:0,end:null,last:agora};
      save('day-'+iso(D),x);wake();toast('Treino retomado','O tempo continua de '+mmss(durSess(x.sess)))}return}
  if(ds.wk){sel=addD(monday(sel),7*+ds.wk);if(tab!=='compras'&&+monday(sel)===+monday(TODAY))sel=new Date(TODAY);render();return}
  if(ds.k){const d=tab==='hoje'?TODAY:sel;const was=on(d,ds.k);if(ds.lid&&!was){const xx=clone(dayDoc(d));if(xx.sess&&xx.sess.start&&!xx.sess.end){xx.sess.last=Date.now();save('day-'+iso(d),xx,true)}}toggle(d,ds.k);
    if(ds.lid&&!was){const tdA=treinoDia(d);const ssA=dayDoc(d).sess;if(tdA&&ssA&&ssA.start&&!ssA.end){const stA=sessStats(d,tdA);if(stA.total&&stA.sets===stA.total){setTimeout(()=>{toast('Todas as séries feitas!','Anote a última carga e toque em Concluir treino');const c=document.getElementById('concluir');if(c)c.scrollIntoView({behavior:'smooth',block:'center'})},900)}}}
    /* ao fechar a última série, já deixa anotado o mesmo do último treino (dá para corrigir) */
    if(ds.lid&&!was){const id=ds.lid,n=+ds.n,D=iso(d);let all=true;for(let s=0;s<n;s++)if(!on(d,'t-'+id+'-'+s))all=false;
      const cur=(lifts()[id]||{})[D]||[];if(all&&!cur.some(hasW)){const tdx=treinoDia(d);const exx=tdx&&exsDia(d,tdx).find(x=>x.id===id);const mt=exx&&metaDia(id,exx.sr,d);
        const prev=prevSession(id,D);const pv=prev?prev.sets[prev.sets.length-1]:null;const fill=mt&&mt.w!=null?{w:mt.w,r:mt.r??''}:hasW(pv)?{w:pv.w,r:pv.r??''}:null;
        if(fill){const L=clone(docs.lifts);L[id]=L[id]||{};L[id][D]=[fill];save('lifts',L)}}
      if(all)setTimeout(()=>{const el=document.getElementById('w-'+id);if(el)el.closest('.ex').scrollIntoView({behavior:'smooth',block:'center'})},60)}
    if(ds.rest&&!was)startRest(+ds.rs||restS());return}
  if(ds.swaptoday){const td=treinoDia(sel);if(td)swapToday(sel,td,ds.swaptoday);return}
  if(ds.unswap){unswap(sel,ds.unswap);return}
  if(ds.restex){const td=treinoDia(sel);if(td)cycleRest(td,ds.restex);return}
  if(ds.ms){msOff=Math.min(0,msOff+ +ds.ms);render();return}
  if(ds.ws){wsOff=Math.min(0,wsOff+ +ds.ws);render();return}
  if(ds.zoom){b.classList.toggle('big');return}
  if(b.classList.contains('day')){sel=fromIso(ds.day);render();return}
  if(ds.water){const x=clone(dayDoc(TODAY));x.water=Math.max(0,(x.water||0)+ +ds.water);save('day-'+iso(TODAY),x);return}
  if(ds.en){const x=clone(dayDoc(sel));x.note=x.note||{};x.note.en=x.note.en===+ds.en?null:+ds.en;save('day-'+iso(sel),x);return}
  if(ds.shop){const id='shop-'+iso(monday(sel));const x=clone(docs[id]);x.got=x.got||{};if(x.got[ds.shop])delete x.got[ds.shop];else x.got[ds.shop]=true;save(id,x);return}
});
app.addEventListener('change',e=>{const i=e.target;const ds=i.dataset;
  if(ds.lw){const id=ds.lw,D=iso(sel);const L=clone(docs.lifts);L[id]=L[id]||{};const old=(L[id][D]||[]);const c=Object.assign({},old[old.length-1]||{});c[ds.f]=num(i.value);L[id][D]=[c];save('lifts',L,true);if(ds.f==='w'||ds.f==='r'){const cc=L[id][D][0];if(hasW(cc)&&isPR(id,D))toast('Novo recorde pessoal!',exNome(id)+' · '+fmtKg(cc.w)+' kg'+(cc.r?' × '+cc.r:''))}return}
  if(i.id==='obs'){const x=clone(dayDoc(sel));x.note=x.note||{};x.note.obs=i.value.trim();save('day-'+iso(sel),x,true);return}
  if(i.id==='av-in'&&i.files&&i.files[0]){avCarregar(i.files[0]);i.value='';return}
  if(i.id==='photoIn'&&i.files&&i.files[0]){addPhoto(i.files[0]);i.value='';return}
  if(i.id==='restoreIn'&&i.files&&i.files[0]){importBackup(i.files[0]);i.value='';return}
  if(i.id==='impIn'&&i.files&&i.files[0]){importPlan(i.files[0]);i.value='';return}
  if(i.id==='ed-nome'){editPlan(p=>{p.nome=i.value.trim()||p.nome},true);return}
  if(ds.edia){editPlan(p=>{p.dias[ds.edia]=i.value||null},true);return}
  if(ds.tn){editPlan(p=>{p.treinos[ds.tn].nome=i.value.trim();p.treinos[ds.tn].auto=!i.value.trim()},true);return}
  if(ds.tc){editPlan(p=>{p.treinos[ds.tc].cardio=i.value.trim()||null},true);return}
  if(ds.enL){editPlan(p=>{const ex=p.treinos[ds.enL].ex[+ds.i];if(ex)ex[ds.f]=i.value.trim()},true);return}
});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='pkF'){pkEscrever();return}
  if(f.id==='pfF'){submitPerfil();return}
  if(f.id==='pinF'){submitPin();return}
  if(f.id==='resetF'){submitReset();return}
  if(f.id==='bodyF'){const B=clone(docs.body);B.e=B.e||{};const ent={};BODY.forEach(([k])=>{const v=num(document.getElementById('b-'+k).value);if(v!=='')ent[k]=v});
    document.activeElement&&document.activeElement.blur();if(Object.keys(ent).length)B.e[iso(TODAY)]=ent;else delete B.e[iso(TODAY)];save('body',B);return}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.target.form)e.target.blur()});

/* ---------- cronômetro de descanso ---------- */
let tEnd=0,tInt=null,actx=null;const tEl=document.getElementById('timer');
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(o=>{const g=actx.createGain(),os=actx.createOscillator();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+o+.2);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(s){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  tEnd=Date.now()+s*1000;tEl.hidden=false;tEl.classList.remove('end');clearInterval(tInt);tInt=setInterval(tickT,250);tickT()}
function tickT(){const r=Math.ceil((tEnd-Date.now())/1000);
  if(r<=0){document.getElementById('tT').textContent='0:00';document.getElementById('tL').textContent='Bora, próxima série';tEl.classList.add('end');clearInterval(tInt);beep();setTimeout(()=>{if(tEl.classList.contains('end'))tEl.hidden=true},6000);return}
  document.getElementById('tT').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');document.getElementById('tL').textContent='Descanso'}
document.getElementById('tPlus').onclick=()=>{if(tEl.classList.contains('end'))startRest(15);else tEnd+=15000};
document.getElementById('tSkip').onclick=()=>{clearInterval(tInt);tEl.hidden=true};

/* ---------- tela acesa durante o treino ---------- */
let lock=null;async function wake(){try{if(tab==='treino'&&!sub&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}else if((tab!=='treino'||sub)&&lock){lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=mid(new Date());if(+t!==+TODAY){TODAY=t;sel=new Date(t)}fecharEsquecidos();render();wake()}});

startGate();if(!gate)fecharEsquecidos();render();wake();if(!gate)loadPhotos();

/* atualização automática: busca versão nova ao abrir e ao voltar para o app, e recarrega sozinho */
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{try{
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  setInterval(()=>reg.update().catch(()=>{}),30*60000);
}catch(e){}});

</script>
